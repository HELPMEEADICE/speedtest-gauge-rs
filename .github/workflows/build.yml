name: build

# 构建 7 个目标的 demo 可执行文件，打包成 tar.gz（二进制 + LICENSE + NOTICE + 运行说明）。
#   - workflow_dispatch：产物作为 Actions artifact 可直接下载；可选把产物也挂到某个 Release
#   - release(published)：自动把产物上传到该 Release
#
# 七个目标全部跑**原生** runner，没有一处交叉编译（因此也不需要交叉链接器/multiarch）：
#   windows-x86_64   windows-latest        x64
#   windows-aarch64  windows-11-arm        arm64
#   macos-x86_64     macos-15-intel        Intel
#   macos-aarch64    macos-latest          Apple Silicon
#   linux-x86_64     ubuntu-latest         x64
#   linux-aarch64    ubuntu-24.04-arm      arm64
#   linux-riscv64    ubuntu-24.04-riscv    RISC-V（RISE 提供的原生硬件，见下）
#
# 优化只在这里生效（CARGO_PROFILE_RELEASE_* 环境变量注入），仓库里的 Cargo.toml 保持默认
# profile——这样 docs/performance.md 记录的体积数字仍然可复现。
# 实测（本机 x86_64 Windows，同样的 8 个变量）：demo.exe 28.68 MiB → 8.92 MiB，构建 70 s。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      only:
        description: '只构建名字包含该子串的目标（如 linux / aarch64 / windows），留空 = 全部'
        required: false
        default: ''
      upload_to_release:
        description: '构建后把产物挂到这个 tag 的 Release（留空 = 只上传 Actions artifact）'
        required: false
        default: ''

permissions:
  contents: write

env:
  # ↓↓↓ 仅 CI 使用的体积优化 profile ↓↓↓
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: "abort"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "false"

jobs:
  # 目标清单动态生成：手动触发时可以用 only 只跑一部分；riscv 需要有 RISE runner 才排进去
  setup:
    name: 生成目标矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
          RISCV: ${{ vars.RISCV_RUNNERS }}
        run: |
          set -euo pipefail
          ALL='[
            {"name":"windows-x86_64","os":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"name":"windows-aarch64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc"},
            {"name":"macos-x86_64","os":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"name":"macos-aarch64","os":"macos-latest","target":"aarch64-apple-darwin"},
            {"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"name":"linux-aarch64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"name":"linux-riscv64","os":"ubuntu-24.04-riscv","target":"riscv64gc-unknown-linux-gnu"}
          ]'
          # RISC-V 的原生 runner 由 RISE 提供（github.com/apps/rise-risc-v-runners-personal）：
          # 没装那个 GitHub App 时 `ubuntu-24.04-riscv` 这个 label 会一直排队，所以用仓库变量
          # RISCV_RUNNERS=true 显式开启；没开启时这一项被剔掉并在日志里留下一行 notice。
          if [ "${RISCV:-}" != "true" ]; then
            echo "::notice::跳过 linux-riscv64：需要安装 RISE RISC-V Runners App，并把仓库变量 RISCV_RUNNERS 设为 true"
          fi
          SELECTED=$(printf '%s' "$ALL" | jq -c --arg f "${ONLY:-}" --arg riscv "${RISCV:-}" '
            [ .[]
              | select($f == "" or (.name | contains($f)))
              | select(.name != "linux-riscv64" or $riscv == "true") ]')
          COUNT=$(printf '%s' "$SELECTED" | jq 'length')
          if [ "$COUNT" = "0" ]; then echo "only='${ONLY:-}' 没有匹配任何目标"; exit 1; fi
          echo "选中 $COUNT 个目标：$(printf '%s' "$SELECTED" | jq -r '.[].name' | tr '\n' ' ')"
          echo "matrix=$(printf '%s' "$SELECTED" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  demo:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Slint 的字体栈在 Linux 上会**链接**系统 fontconfig（yeslogic-fontconfig-sys）。
      # 因为是原生 runner，直接装本机 amd64/arm64/riscv64 的开发包即可，不涉及 multiarch。
      - name: Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev

      - name: Build demo（优化 release profile；变量已在 job 级注入）
        run: cargo build --release --target ${{ matrix.target }} --example demo

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          NAME="speedtest-gauge-demo-${{ matrix.name }}"
          EXE=demo
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=demo.exe; fi
          BIN="target/${{ matrix.target }}/release/examples/$EXE"
          test -f "$BIN" || { echo "missing binary: $BIN"; ls -R "target/${{ matrix.target }}/release/examples" || true; exit 1; }

          rm -rf dist && mkdir -p dist/stage
          cp "$BIN" "dist/stage/$EXE"
          cp LICENSE NOTICE.md packaging/README-demo.txt dist/stage/
          tar -czf "dist/$NAME.tar.gz" -C dist/stage .
          ( cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )

          echo "--- 产物 ---"
          ls -l dist
          echo "二进制：$(du -h "dist/stage/$EXE" | cut -f1)  压缩包：$(du -h "dist/$NAME.tar.gz" | cut -f1)"
          echo "架构：$(file "dist/stage/$EXE" 2>/dev/null || echo '(file 不可用)')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-gauge-demo-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 Release
        if: github.event_name == 'release' || inputs.upload_to_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.upload_to_release }}
        shell: bash
        run: |
          set -euo pipefail
          echo "上传到 Release tag: $TAG"
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 \
            --repo "${{ github.repository }}" --clobber
